name: Sync anther web and notification icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-shell/app/src/main/res/drawable/appicon.png"
      - "scripts/sync-anther-icons.py"
      - ".github/workflows/sync-anther-icons.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image tools
        run: python -m pip install "Pillow==11.3.0"
      - name: Create app and notification icon assets
        run: python scripts/sync-anther-icons.py
      - name: Commit refreshed icons if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icon-192.png public/icon-512.png public/badge-96.png
          if ! git diff --cached --quiet; then
            git commit -m "Sync anther icons from Android appicon"
            git push
          fi
